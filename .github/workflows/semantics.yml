name: Semantics
on: workflow_dispatch
jobs:
  probe:
    name: Z probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: node runs typescript directly
        env:
          BASE_SHA: ${{ github.event.repository.id && '' }}
        run: |
          echo "node: $(node --version)"
          BASE_SHA=$(git rev-parse HEAD~1) HEAD_SHA=$(git rev-parse HEAD) node ./scripts/docs-only-change.ts
          echo "exit=$?"
      - name: timing - corepack pnpm dlx tsx
        run: |
          time (corepack pnpm dlx tsx --version) || echo "corepack pnpm dlx failed"
      - name: timing - npx -y tsx
        run: |
          time (npx -y tsx --version) || echo "npx failed"

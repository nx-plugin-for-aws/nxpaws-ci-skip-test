name: Semantics
on: workflow_dispatch
jobs:
  probe:
    name: Z probe tooling
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "pnpm: $(command -v pnpm || echo MISSING)"
          pnpm --version || true
          echo "corepack: $(command -v corepack || echo MISSING)"
  skipped_job:
    name: A skipped
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo a
  gate:
    name: B gate
    needs: [skipped_job]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      val: ${{ steps.s.outputs.val }}
    steps:
      - id: s
        run: echo "val=hello" >> "$GITHUB_OUTPUT"
  success_if:
    name: F success()
    needs: [gate]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - run: echo f
  success_and_output_if:
    name: G success() plus output
    needs: [gate]
    if: ${{ success() && needs.gate.outputs.val == 'hello' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo g
